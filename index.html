<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Flow Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grid-wrapper">
        <header class="header">
            <div class="header-left">
                <h1>My Flow</h1>
                <div class="location-picker">
                    <input type="text" id="cityInput" placeholder="Change city...">
                    <button id="searchCityBtn" class="btn-sleek-add">Update</button>
                    <button id="geoBtn" class="icon-geo">📍</button>
                </div>
            </div>
            <div class="header-right">
                <div id="weatherWidget" class="weather-badge">
                    <span id="tempText">Loading...</span>
                </div>
                <div class="theme-toggle">
                    <span>☀️</span>
                    <label class="switch">
                        <input type="checkbox" id="darkModeToggle">
                        <span class="slider round"></span>
                    </label>
                    <span>🌙</span>
                </div>
            </div>
        </header>

        <aside class="sidebar">
            <div class="sidebar-content">
                <h3>Daily Spark</h3>
                <div class="quote-mini-card">
                    <div id="quoteLoader" class="loader"></div>
                    <p id="quoteText">"Fetching inspiration..."</p>
                    <small id="quoteAuthor"></small>
                </div>
                <button id="getQuoteBtn" class="nav-btn-sleek">✨ New Quote</button>
            </div>
        </aside>

        <main class="main-content">
            <section class="task-card">
                <div class="input-group-sleek">
                    <input type="text" id="taskInput" placeholder="Add a new task...">
                    <button id="addTaskBtn" class="btn-sleek-add">Add Task</button>
                </div>
                <nav class="tabs-sleek" id="tabGroup">
                    <button class="tab-btn active" data-filter="all">All</button>
                    <button class="tab-btn" data-filter="today">Today</button>
                    <button class="tab-btn" data-filter="completed">Done</button>
                </nav>
                <ul id="taskList"></ul>
            </section>

            <section class="task-card">
                <div class="header-flex">
                    <h3>Project Gallery</h3>
                    <button id="refreshGallery" class="btn-sleek-add" style="padding: 5px 15px; font-size: 0.7rem;">🔄 Shuffle</button>
                </div>
                <div class="image-grid" id="imageGallery">
                    </div>
            </section>
        </main>

        <footer class="footer">
            <p>© 2026 My Flow Dashboard</p>
            <button id="clearCompleted" class="btn-link">Clear Completed Tasks</button>
        </footer>
    </div>

    <div id="imageModal" class="modal">
        <span class="modal-close">&times;</span>
        <button class="modal-nav prev">❮</button>
        <div class="modal-content-wrapper">
            <img id="modalImg" src="" alt="Enlarged view">
            <p id="modalCaption"></p>
        </div>
        <button class="modal-nav next">❯</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
