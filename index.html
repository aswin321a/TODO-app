<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>My To-Do List</h1>
            <div class="theme-toggle">
                <span>☀️</span>
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle">
                    <span class="slider round"></span>
                </label>
                <span>🌙</span>
            </div>
        </header>

        <section class="registration-section">
            <h3>Create Account</h3>
            <form id="registrationForm" novalidate>
                <div class="form-group">
                    <input type="text" id="username" placeholder="Full Name">
                    <small class="error-msg"></small>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email Address">
                    <small class="error-msg"></small>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password">
                    <small class="error-msg"></small>
                </div>
                <div class="form-group">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password">
                    <small class="error-msg"></small>
                </div>
                <button type="submit" id="submitReg">Register</button>
            </form>
        </section>

        <hr class="divider">

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn">Add Task</button>
        </div>

        <nav class="tabs" id="tabGroup">
            <button class="tab active" data-filter="all">All Tasks</button>
            <button class="tab" data-filter="today">Today</button>
            <button class="tab" data-filter="completed">Completed</button>
        </nav>

        <main id="tasksContainer">
            <ul id="taskList">
                </ul>
        </main>

        <footer class="sleek-footer">
            <button id="clearCompleted" class="footer-btn">🧹 Clear Completed</button>
            <button id="settingsBtn" class="footer-btn">⚙️ Settings</button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
