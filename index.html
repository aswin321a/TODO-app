<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Dashboard Flow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="top-header-actions">
            <div class="theme-toggle">
                <span>☀️</span>
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle">
                    <span class="slider round"></span>
                </label>
                <span>🌙</span>
            </div>
        </div>

        <header>
            <h1>My Flow</h1>
            <div class="weather-box">
                <div class="weather-input-grp">
                    <input type="text" id="cityInput" placeholder="Enter City...">
                    <button id="searchCityBtn" class="icon-btn">🔍</button>
                    <button id="geoBtn" class="icon-btn">📍</button>
                </div>
                <div id="weatherWidget" class="weather-badge">
                    <span id="tempText">Loading weather...</span>
                </div>
            </div>
        </header>

        <section class="quote-card">
            <div id="quoteLoader" class="loader"></div>
            <div id="quoteDisplay">
                <p id="quoteText">Fetching your daily spark...</p>
                <small id="quoteAuthor"></small>
            </div>
            <button id="getQuoteBtn" class="btn-primary-mini">✨ Refresh Quote</button>
        </section>

        <section class="registration-section">
            <h3>Create Account</h3>
            <form id="registrationForm" novalidate>
                <div class="form-group">
                    <input type="text" id="username" placeholder="Full Name">
                    <small class="error-msg"></small>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email Address">
                    <small class="error-msg"></small>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <input type="password" id="password" placeholder="Password">
                        <small class="error-msg"></small>
                    </div>
                    <div class="form-group">
                        <input type="password" id="confirmPassword" placeholder="Confirm">
                        <small class="error-msg"></small>
                    </div>
                </div>
                <button type="submit" class="btn-primary-wide">Register</button>
            </form>
        </section>

        <hr class="divider">

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="What needs to be done?">
            <button id="addTaskBtn" class="btn-primary">Add Task</button>
        </div>

        <nav class="tabs" id="tabGroup">
            <button class="tab active" data-filter="all">All</button>
            <button class="tab" data-filter="today">Today</button>
            <button class="tab" data-filter="completed">Done</button>
        </nav>

        <main id="tasksContainer">
            <ul id="taskList"></ul>
        </main>

        <footer class="sleek-footer">
            <button id="clearCompleted" class="btn-outline">🧹 Clear Done</button>
            <button id="settingsBtn" class="btn-outline">⚙️ Settings</button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
